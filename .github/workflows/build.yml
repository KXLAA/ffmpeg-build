name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # In an Alpine container of the runner's architecture.
          - { platform: linux-x64, runner: ubuntu-24.04, script: build-linux.sh }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, script: build-linux.sh }
          - { platform: win32-x64, runner: ubuntu-24.04, script: build-windows.sh }
          - { platform: darwin-arm64, runner: macos-15, script: build-macos.sh }
          - { platform: darwin-x64, runner: macos-15, script: build-macos.sh }
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mingw-w64 and nasm
        if: matrix.platform == 'win32-x64'
        run: sudo apt-get update -y && sudo apt-get install -y mingw-w64 nasm

      - name: Install nasm
        if: matrix.platform == 'darwin-x64'
        run: brew install nasm

      - name: Build
        run: ./${{ matrix.script }}

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: dist/ffmpeg-*-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  test:
    name: Test ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: win32-x64, runner: windows-2025 }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform }}
          path: dist

      - name: Smoke test
        run: ./smoke-test.sh dist/ffmpeg-*-${{ matrix.platform }}.tar.gz

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Check the tag names the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          count=$(find dist -name "ffmpeg-${version%-*}-*.tar.gz" | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "$TAG names ffmpeg ${version%-*}, but the tarballs are:" >&2
            ls dist >&2
            exit 1
          fi

      - name: Checksum
        working-directory: dist
        run: sha256sum ffmpeg-*.tar.gz | tee SHA256SUMS

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ffmpeg-*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          gh release create "$TAG" dist/ffmpeg-*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "FFmpeg ${version%-*}, build ${version##*-}. Each tarball's BUILD.txt lists its sources and configure flags."
